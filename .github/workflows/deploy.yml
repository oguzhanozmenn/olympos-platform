name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Eğer branch adın farklıysa (ana gibi) burayı ona göre değiştir

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/hypertrophy-engine
          push: true
          tags: ozii4333/olympos-platform:latest
            ozii4333/olympos-platform:v1.0.7